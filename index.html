<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Photobooth</title>
<style>
  :root { --accent: #ff2d75; --bg: #111; --fg: #eee; --card: #1c1c1c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .booth { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 16px; }
  .stage { position: relative; width: 100%; max-width: 720px; aspect-ratio: 4/3; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .stage img.preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  .review { position: absolute; inset: 0; background: #000 center/contain no-repeat; opacity: 0; transition: opacity 0.25s; z-index: 3; }
  .review.on { opacity: 1; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
  .cd { font-size: 30vh; font-weight: 900; color: #fff; text-shadow: 0 8px 24px rgba(0,0,0,0.85); opacity: 0; transform: scale(0.7); transition: opacity 0.15s, transform 0.15s; }
  .cd.on { opacity: 1; transform: scale(1); }
  .cd.smile { font-size: 15vh; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 2; transition: opacity 0.08s; }
  .flash.on { opacity: 1; transition: opacity 0.03s; }

  button.shoot { background: var(--accent); color: #fff; border: none; padding: 22px 56px; font-size: 22px; font-weight: 700; border-radius: 100px; cursor: pointer; box-shadow: 0 6px 20px rgba(255,45,117,0.45); transition: transform 0.08s; }
  button.shoot:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
  button.shoot:active:not(:disabled) { transform: scale(0.96); }

  h2 { padding: 20px 16px 8px; font-size: 13px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
  .toolbar { display: flex; gap: 8px; justify-content: center; padding: 0 16px 12px; }
  .toolbar a { background: #333; color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; padding: 0 8px 60px; }
  .card { background: var(--card); border-radius: 8px; overflow: hidden; position: relative; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .card a.dl { position: absolute; right: 6px; top: 6px; background: rgba(0,0,0,.65); color: #fff; padding: 4px 8px; border-radius: 6px; text-decoration: none; font-size: 12px; }
  .card .meta { padding: 6px 8px; font-size: 11px; color: #999; }
  .empty { padding: 40px; text-align: center; color: #666; }
</style>
</head>
<body>
<div class="booth">
  <div class="stage" id="stage">
    <img class="preview" src="/stream.mjpg" alt="live preview">
    <div class="review" id="review"></div>
    <div class="overlay"><div class="cd" id="cd"></div></div>
    <div class="flash" id="flash"></div>
  </div>
  <button class="shoot" id="shootBtn">📸 TAKE PHOTO</button>
</div>

<h2>📷 Gallery</h2>
<div class="toolbar" id="toolbar"></div>
<div id="galleryWrap"></div>

<script>
const btn      = document.getElementById('shootBtn');
const cd       = document.getElementById('cd');
const flash    = document.getElementById('flash');
const review   = document.getElementById('review');
const toolbar  = document.getElementById('toolbar');
const wrap     = document.getElementById('galleryWrap');

btn.addEventListener('click', async () => {
  btn.disabled = true;
  try { await fetch('/capture', {method: 'POST'}); } catch (e) {}
});

let lastState = 'idle';
let lastPhoto = null;

async function poll() {
  try {
    const r = await fetch('/status');
    const s = await r.json();

    // Countdown / SMILE
    if (s.countdown) {
      cd.textContent = s.countdown;
      cd.classList.toggle('smile', s.countdown === 'SMILE!');
      cd.classList.add('on');
    } else {
      cd.classList.remove('on');
    }

    // Capture flash overlay
    flash.classList.toggle('on', s.state === 'capture');

    // Show the captured photo during review
    if (s.state === 'review' && s.latest_photo) {
      if (s.latest_photo !== lastPhoto) {
        review.style.backgroundImage = `url('/photo/${s.latest_photo}')`;
        lastPhoto = s.latest_photo;
      }
      review.classList.add('on');
    } else {
      review.classList.remove('on');
    }

    // Coming back to idle after a capture: re-enable + refresh gallery
    if (lastState !== 'idle' && s.state === 'idle') {
      btn.disabled = false;
      refreshGallery();
    }

    // Button state: disabled unless idle
    btn.disabled = (s.state !== 'idle');

    lastState = s.state;
  } catch (e) {
    console.error('poll error', e);
  }
}
setInterval(poll, 200);
poll();

async function refreshGallery() {
  try {
    const r = await fetch('/gallery.json');
    const photos = await r.json();
    if (photos.length === 0) {
      toolbar.innerHTML = '';
      wrap.innerHTML = '<div class="empty">No photos yet — press the button.</div>';
      return;
    }
    toolbar.innerHTML = `<a href="/download-all">Download all (${photos.length})</a>`;
    wrap.innerHTML = '<div class="grid">' + photos.map(p => `
      <div class="card">
        <a href="/photo/${p.name}" target="_blank"><img src="/photo/${p.name}" loading="lazy"></a>
        <a class="dl" href="/download/${p.name}">⬇</a>
        <div class="meta">${p.when}</div>
      </div>
    `).join('') + '</div>';
  } catch (e) { console.error('gallery error', e); }
}
refreshGallery();
</script>
</body>
</html>
